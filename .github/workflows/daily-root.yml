name: daily-root
on:
  schedule:
    - cron: "23 0 * * *"
  workflow_dispatch: {}
permissions:
  contents: write
jobs:
  root:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: node compute-root.mjs
      - name: OpenTimestamps stamp (best effort)
        run: |
          latest=$(ls roots/*.json 2>/dev/null | sort | tail -1)
          if [ -n "$latest" ] && [ ! -f "$latest.ots" ]; then
            pip install --quiet opentimestamps-client && ots stamp "$latest" || echo "ots stamp failed (non-fatal)"
          fi
      - name: commit
        run: |
          git config user.name "kyv-attest-bot"
          git config user.email "bot@users.noreply.github.com"
          git add roots/
          git diff --cached --quiet || git commit -m "root: $(date -u +%F)"
          git push
